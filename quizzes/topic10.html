<!doctype html>
<html lang="en" data-theme="dark"><script>try{var _t=localStorage.getItem("theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic 10 Quiz – Short-Term Financial Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--surface:#111118;--card:#16161e;--border:#2a2a38;--border-hi:#3d3d52;--text:#f0efff;--muted:#8b8aab;--dim:#55546e;--gold:#e8b84b;--gold-bg:rgba(232,184,75,0.10);--accent:#f59e0b;--accent-bg:rgba(245,158,11,0.12);--correct:#34d399;--correct-bg:rgba(52,211,153,0.12);--wrong:#f87171;--wrong-bg:rgba(248,113,113,0.12);}
[data-theme="light"]{--bg:#f5f4f0;--surface:#eeede8;--card:#fff;--border:#dddbd4;--border-hi:#c8c5bc;--text:#1a1814;--muted:#706c60;--dim:#a09c90;--gold:#b8861a;--gold-bg:rgba(184,134,26,0.08);--accent:#d97706;--accent-bg:rgba(217,119,6,0.10);--correct:#059669;--correct-bg:rgba(5,150,105,0.10);--wrong:#dc2626;--wrong-bg:rgba(220,38,38,0.10);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.topbar{position:sticky;top:0;z-index:50;background:rgba(9,9,15,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px}
[data-theme="light"] .topbar{background:rgba(245,244,240,0.88)}
.topbar-brand{font-size:0.9rem;font-weight:700;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
.topbar-brand span{font-size:0.68rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:2px 8px}
.back-link{font-size:0.78rem;font-weight:600;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.theme-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.timer-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 12px;height:34px;cursor:pointer;font-size:0.72rem;font-weight:700;color:var(--muted);white-space:nowrap}
.timer-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.container{max-width:680px;margin:0 auto;padding:48px 20px 80px}
.quiz-header{text-align:center;margin-bottom:40px}
.quiz-eyebrow{font-size:0.68rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.quiz-title{font-size:1.9rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.quiz-sub{color:var(--muted);font-size:0.88rem}
.progress-bar-wrap{background:var(--surface);border-radius:99px;height:6px;margin-bottom:32px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s ease}
.progress-label{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--dim);margin-bottom:8px}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 28px 24px;margin-bottom:20px}
.q-num{font-size:0.68rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.q-timer{font-size:0.8rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.q-timer.warn{color:var(--wrong)}
.q-text{font-size:1.05rem;font-weight:600;line-height:1.45;margin-bottom:22px}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:0.9rem;font-weight:500;cursor:pointer;text-align:left;color:var(--text);transition:border-color 0.15s,background 0.15s;display:flex;align-items:center;gap:12px}
.option:hover:not(:disabled){border-color:var(--border-hi);background:var(--card)}
.option.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.option.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.option:disabled{cursor:default}
.opt-letter{width:24px;height:24px;border-radius:6px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0}
.option.correct .opt-letter{background:var(--correct);border-color:var(--correct);color:#fff}
.option.wrong .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff}
.feedback{margin-top:14px;padding:12px 16px;border-radius:8px;font-size:0.85rem;font-weight:500;display:none}
.feedback.show{display:block}
.feedback.correct{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct)}
.feedback.wrong{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong)}
.key-hint{font-size:0.7rem;color:var(--dim);text-align:right;margin-top:8px}
.actions{display:flex;justify-content:flex-end;margin-top:20px}
.btn-next{background:var(--accent);color:#000;border:none;border-radius:10px;padding:11px 28px;font-size:0.88rem;font-weight:700;cursor:pointer;display:none}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 28px;text-align:center;display:none}
.result-score{font-size:3.5rem;font-weight:800;letter-spacing:-0.04em;color:var(--accent);line-height:1}
.result-out{font-size:1rem;color:var(--muted);margin:6px 0 4px}
.result-msg{font-size:1.05rem;font-weight:600;margin-bottom:28px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-retry{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:11px 24px;font-size:0.88rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn-missed{background:rgba(248,113,113,0.12);color:#f87171;border:1px solid #f87171;border-radius:10px;padding:11px 24px;font-size:0.88rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn-hub{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px 24px;font-size:0.88rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-hub:hover{border-color:var(--border-hi);color:var(--text)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand"><span>LO6</span>Short-Term Financial Management</div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="timer-btn" id="timer-toggle" onclick="toggleTimer()">⏱ Timer: Off</button>
    <a class="back-link" href="../index.html">← Hub</a>
    <button class="theme-btn" onclick="toggleTheme()">☀️</button>
  </div>
</div>
<div class="container">
  <div class="quiz-header">
    <div class="quiz-eyebrow">Unit 1 · LO6</div>
    <h1 class="quiz-title">Short-Term Financial Management</h1>
    <p class="quiz-sub">10 questions drawn from a pool of 22 · Press 1–4 to answer, Enter for next</p>
  </div>
  <div class="progress-label"><span id="prog-text">Question 1 of 10</span><span id="prog-score">Score: 0</span></div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:10%"></div></div>
  <div id="quiz-area"></div>
  <div class="key-hint">Keyboard: 1–4 to answer · Enter or Space to advance</div>
  <div class="actions"><button class="btn-next" id="btn-next" onclick="nextQ()">Next →</button></div>
  <div class="result-card" id="result"></div>
</div>
<script>
const TOPIC_ID='topic10';const DRAW=10;
const POOL=[
  {q:"A cash flow forecast shows:",opts:["The value of a business's assets at a point in time","Expected money coming in and going out over a future period","A summary of past income and spending","The interest earned on savings over a year"],ans:1,exp:"A cash flow forecast maps projected income (inflows) against projected expenditure (outflows) over a future period — typically monthly. It helps identify when a cash shortfall might occur so action can be taken in advance. A negative closing balance signals a potential problem."},
  {q:"'Living within your means' is best defined as:",opts:["Spending exactly your entire income each month","Spending no more than your income — avoiding debt for non-essential items","Only spending on essentials","Having savings equal to six months' income"],ans:1,exp:"Living within your means means total expenditure does not exceed total income — you are not relying on credit or borrowing to fund your lifestyle. This is the foundation of financial wellbeing, allowing savings and avoiding problematic debt."},
  {q:"The UK measure of general price inflation used for most official purposes is:",opts:["RPI (Retail Price Index)","CPI (Consumer Price Index)","GDP deflator","House Price Index"],ans:1,exp:"The Consumer Price Index (CPI) is the UK's primary measure of inflation, tracking price changes in a basket of goods and services. It is used to set the Bank of England's 2% inflation target and to uprate many benefits and tax thresholds. RPI is older and generally higher but still used for some purposes (e.g., student loan interest)."},
  {q:"Which of the following is an example of a 'fixed' expenditure?",opts:["Grocery shopping","Rent or mortgage payment","Clothing","Entertainment"],ans:1,exp:"Fixed expenditure stays the same each month regardless of behaviour — rent, mortgage payments, insurance premiums, and loan repayments are typical examples. Variable expenditure (groceries, clothing, entertainment) changes with choices and habits. Distinguishing fixed from variable costs is key to budgeting."},
  {q:"An emergency fund is generally recommended to cover:",opts:["One week of expenses","One month of expenses","Three to six months of essential expenses","Your annual holiday costs"],ans:2,exp:"Financial guidance typically recommends holding three to six months' worth of essential living expenses in an accessible emergency fund. This provides a buffer against unexpected events such as job loss, car breakdown, or boiler failure, without needing to rely on credit."},
  {q:"Car insurance is an example of:",opts:["Voluntary insurance","Mandatory (compulsory) insurance","Life assurance","Payment protection insurance"],ans:1,exp:"Third-party car insurance (as a minimum) is a legal requirement in the UK for any vehicle used on public roads. Driving without insurance is a criminal offence. Comprehensive and third-party fire and theft policies offer additional cover above the legal minimum, but the legal minimum is mandatory."},
  {q:"Travel insurance typically covers which of the following?",opts:["Speeding fines abroad","Pre-existing medical conditions without disclosure","Medical emergencies, trip cancellation, and lost luggage","Criminal penalties in foreign countries"],ans:2,exp:"Standard travel insurance covers medical emergencies abroad, trip cancellation or curtailment, lost or stolen luggage, and personal liability. Pre-existing medical conditions must be declared and may increase the premium or be excluded. Fines and criminal penalties are never covered."},
  {q:"Which of the following best describes 'good debt'?",opts:["Any debt with a low interest rate","Borrowing used to fund an asset or opportunity that increases future income or value, such as a student loan or mortgage","Borrowing for a holiday","Using a credit card for everyday purchases"],ans:1,exp:"Good debt is broadly defined as borrowing that funds something with long-term value or income potential — a mortgage (buys an appreciating asset) or a student loan (improves earning capacity). Bad debt funds depreciating or consumable items, often at high interest rates (e.g., payday loans for holidays or consumer goods)."},
  {q:"A debt management plan (DMP) is best described as:",opts:["A legal court order requiring debt repayment","An informal arrangement with creditors to repay debts at an affordable rate, usually through a free debt advice charity","A government scheme that writes off debts after five years","A type of secured loan used to consolidate debts"],ans:1,exp:"A DMP is an informal agreement (not a legal insolvency process) between a debtor and their creditors, usually arranged through a free debt charity (StepChange, National Debtline). Monthly payments are consolidated into one affordable amount and distributed to creditors. Creditors may freeze interest. There is no court involvement, and the debtor's credit file will be impacted."},
  {q:"Which organisation offers free, independent debt advice in the UK?",opts:["The FCA","StepChange Debt Charity","The Bank of England","HMRC"],ans:1,exp:"StepChange (formerly the Consumer Credit Counselling Service) is a leading free UK debt charity offering telephone and online debt advice and debt management plans. Other free services include Citizens Advice, National Debtline, and PayPlan. Commercial debt management companies charge fees — free services should always be tried first."},
  {q:"Pet insurance is an example of:",opts:["Compulsory insurance","Voluntary insurance","Life assurance","Mortgage protection"],ans:1,exp:"Pet insurance is entirely voluntary — there is no legal requirement to insure a pet. However, it can prevent large unexpected vet bills. Compulsory insurance in the UK includes motor insurance (third party as minimum) and employers' liability insurance for businesses with staff."},
  {q:"What is creditworthiness?",opts:["The total amount of credit available to a person","A lender's assessment of how likely a borrower is to repay a debt, based on credit history, income, and other factors","The interest rate charged on a credit card","The maximum legal amount that can be borrowed"],ans:1,exp:"Creditworthiness is how lenders assess the risk of lending to someone — essentially, how likely they are to repay. It is based on credit history (from credit reference agencies), income, employment status, existing debts, and other factors. A high creditworthiness leads to better rates and higher credit limits."},
  {q:"Which of the following consequences could result from consistently spending more than your income?",opts:["An improved credit score","Accumulation of debt, potential default, and damage to credit rating","Higher savings returns","Automatic entitlement to government support"],ans:1,exp:"Consistently spending beyond income leads to growing debt, missed payments, and potential default. This damages a credit rating, making future borrowing more expensive or unavailable. Serious cases can lead to court judgments (CCJs), debt management plans, individual voluntary arrangements (IVAs), or bankruptcy."},
  {q:"A County Court Judgment (CCJ) is issued when:",opts:["A person earns below the minimum wage","A creditor takes legal action after a debt is unpaid and the court rules in the creditor's favour","A person declares bankruptcy","A bank account is overdrawn"],ans:1,exp:"A CCJ is a court order in England and Wales issued when a person fails to repay a debt and the creditor takes legal action. The CCJ sets out how much is owed and how it must be repaid. It stays on the credit file for six years, making borrowing significantly harder and more expensive."},
  {q:"Which of the following is a consequence of a poor credit rating?",opts:["Higher savings interest rates","Difficulty obtaining credit, and higher interest rates when credit is available","Automatic debt write-off after two years","Lower mortgage repayments"],ans:1,exp:"A poor credit rating signals higher risk to lenders, resulting in rejected applications, lower credit limits, and higher interest rates on any credit offered. It can also affect mobile phone contracts, rental applications, and some employment checks. Improving a credit rating takes time — consistently paying on time and reducing balances helps."},
  {q:"The purpose of budgeting is to:",opts:["Avoid paying any taxes","Plan and control income and expenditure to achieve financial goals and avoid deficit spending","Maximise the amount spent each month","Automatically increase income"],ans:1,exp:"Budgeting is the process of planning how income will be allocated across expenses, savings, and debt repayment. An effective budget ensures essential costs are covered, savings goals are met, and spending stays within income. It is the core tool for short-term financial management."},
  {q:"'Discretionary expenditure' refers to:",opts:["Essential fixed costs like rent","Non-essential spending that can be reduced or cut, such as eating out or subscriptions","Government-mandated spending","Tax payments"],ans:1,exp:"Discretionary expenditure covers non-essential items — dining out, holidays, streaming services, gym memberships, clothing beyond basics. Unlike fixed essential costs, discretionary spending can be reduced when money is tight. Identifying and cutting discretionary costs is often the first step when budgeting to reduce a deficit."},
  {q:"Which of the following is an example of 'bad debt'?",opts:["A student loan for university tuition","A mortgage to purchase a property","A high-interest payday loan to pay for a holiday","A business loan to purchase equipment"],ans:2,exp:"Bad debt finances consumable or depreciating items, often at high cost. A payday loan to fund a holiday leaves the borrower with no asset and significant interest charges — the holiday is consumed but the debt remains. The high APR (often hundreds or thousands of percent) makes this particularly damaging to financial health."},
  {q:"If a cash flow forecast shows a negative closing balance in March, this means:",opts:["March will be the most profitable month","More money is expected to go out than come in that month, leaving a deficit","Tax is due in March","Savings must be withdrawn in March"],ans:1,exp:"A negative closing balance in a cash flow forecast means projected outflows exceed inflows for that period. The individual will need to either cut spending, increase income, use savings, or access credit to cover the shortfall. Identifying this in advance allows time to plan a solution."},
  {q:"Which type of insurance protects the lender if a borrower dies or becomes unable to work and cannot repay a mortgage or loan?",opts:["Travel insurance","Contents insurance","Payment Protection Insurance (PPI)","Pet insurance"],ans:2,exp:"Payment Protection Insurance (PPI) was designed to cover loan or credit card repayments if the policyholder became ill, had an accident, or was made redundant. PPI was mis-sold on a massive scale in the UK — the mis-selling scandal led to over £38 billion in compensation. Modern income protection insurance serves a similar legitimate purpose."},
  {q:"The Money and Pensions Service (MaPS) provides:",opts:["Regulated investment advice","Free, impartial money guidance and debt information to the public","Pension fund management","Credit ratings for individuals"],ans:1,exp:"The Money and Pensions Service (MaPS) is a government-sponsored body that provides free financial guidance — not regulated advice — through MoneyHelper (formerly Money Advice Service), Pension Wise, and The Pensions Advisory Service. It helps people make informed financial decisions without charging fees."},
  {q:"Which of the following would typically NOT be included in a personal monthly budget?",opts:["Rent or mortgage","Grocery shopping","The value of a pension fund","Utility bills"],ans:2,exp:"A monthly budget captures regular income and outgoings — rent, food, bills, transport, loan repayments. The value of a pension fund is a long-term asset, not a monthly cash flow item. It appears on a net worth statement, not a budget. Pension contributions (the amount paid in each month) would appear in a budget, but the fund value itself would not."}
];
POOL.forEach((q,i)=>q._id=i);
let sessionQ=[],cur=0,score=0,answered=false,finished=false;
let timerOn=false,timerSecs=60,timerInterval=null;
const retryMissed=location.search.includes('retry=missed');
try{timerOn=localStorage.getItem(TOPIC_ID+'_timer')==='true';}catch(e){}
function updateTimerBtn(){const b=document.getElementById('timer-toggle');if(!b)return;b.textContent='⏱ Timer: '+(timerOn?'On':'Off');b.className='timer-btn'+(timerOn?' active':'');}
function initSession(){
  let pool;
  if(retryMissed){
    try{const m=JSON.parse(localStorage.getItem(TOPIC_ID+'_missed')||'[]');pool=POOL.filter(q=>m.includes(q._id));}catch(e){pool=[];}
    if(!pool.length)pool=[...POOL];
  }else{
    pool=[...POOL];
    try{localStorage.removeItem(TOPIC_ID+'_missed');}catch(e){}
  }
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  sessionQ=pool.slice(0,Math.min(DRAW,pool.length));
  cur=0;score=0;answered=false;finished=false;
  updateTimerBtn();render();
}
function render(){
  const q=sessionQ[cur];const L=['A','B','C','D'];
  document.getElementById('prog-text').textContent=`Question ${cur+1} of ${sessionQ.length}`;
  document.getElementById('prog-score').textContent=`Score: ${score}`;
  document.getElementById('prog-bar').style.width=`${((cur+1)/sessionQ.length)*100}%`;
  document.getElementById('quiz-area').innerHTML=`<div class="q-card"><div class="q-num"><span>Question ${cur+1}</span>${timerOn?`<span class="q-timer" id="q-timer">${timerSecs}s</span>`:''}</div><div class="q-text">${q.q}</div><div class="options">${q.opts.map((o,i)=>`<button class="option" onclick="pick(${i})" id="opt${i}"><span class="opt-letter">${L[i]}</span>${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div></div>`;
  document.getElementById('btn-next').style.display='none';
  answered=false;
  if(timerOn)startTimer();
}
function startTimer(){
  clearInterval(timerInterval);timerSecs=60;
  timerInterval=setInterval(()=>{
    timerSecs--;
    const el=document.getElementById('q-timer');
    if(el){el.textContent=timerSecs+'s';if(timerSecs<=10)el.classList.add('warn');}
    if(timerSecs<=0){clearInterval(timerInterval);pick(-1);}
  },1000);
}
function pick(i){
  if(answered)return;answered=true;clearInterval(timerInterval);
  const q=sessionQ[cur];const fb=document.getElementById('feedback');
  document.querySelectorAll('.option').forEach(b=>b.disabled=true);
  if(i===q.ans){
    score++;
    if(i>=0)document.getElementById(`opt${i}`).className='option correct';
    fb.className='feedback show correct';fb.textContent='✓ Correct! '+q.exp;
  }else{
    if(i>=0)document.getElementById(`opt${i}`).className='option wrong';
    document.getElementById(`opt${q.ans}`).className='option correct';
    fb.className='feedback show wrong';fb.textContent=(i===-1?'⏱ Time\'s up! ':'✗ ')+q.exp;
    try{const m=JSON.parse(localStorage.getItem(TOPIC_ID+'_missed')||'[]');if(!m.includes(q._id))m.push(q._id);localStorage.setItem(TOPIC_ID+'_missed',JSON.stringify(m));}catch(e){}
  }
  document.getElementById('prog-score').textContent=`Score: ${score}`;
  const nb=document.getElementById('btn-next');nb.style.display='block';nb.textContent=cur<sessionQ.length-1?'Next →':'See Results';
}
function nextQ(){cur++;if(cur>=sessionQ.length){showResult();return;}render();}
function showResult(){
  finished=true;clearInterval(timerInterval);
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('btn-next').style.display='none';
  document.querySelector('.progress-label').style.display='none';
  document.querySelector('.progress-bar-wrap').style.display='none';
  document.querySelector('.key-hint').style.display='none';
  const pct=Math.round((score/sessionQ.length)*100);
  const msg=pct>=80?'Excellent work! 🎉':pct>=60?'Good effort — review the explanations above.':'Keep studying — you\'ve got this!';
  try{localStorage.setItem(TOPIC_ID+'_last',JSON.stringify({score,total:sessionQ.length,pct,date:new Date().toISOString()}));}catch(e){}
  let missedCount=0;try{missedCount=(JSON.parse(localStorage.getItem(TOPIC_ID+'_missed')||'[]')).length;}catch(e){}
  const base=location.href.split('?')[0];
  const r=document.getElementById('result');r.style.display='block';
  r.innerHTML=`<div class="result-score">${score}/${sessionQ.length}</div><div class="result-out">${pct}% correct</div><div class="result-msg">${msg}</div><div class="result-actions"><a class="btn-retry" href="${base}">↺ New Quiz</a>${missedCount>0?`<a class="btn-missed" href="${base}?retry=missed">↯ Retry ${missedCount} missed</a>`:''}<a class="btn-hub" href="../index.html">← Hub</a></div>`;
}
function toggleTimer(){timerOn=!timerOn;try{localStorage.setItem(TOPIC_ID+'_timer',timerOn);}catch(e){}updateTimerBtn();}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme')||'dark';const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);document.querySelector('.theme-btn').textContent=n==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',n);}catch(e){}}
document.addEventListener('keydown',e=>{
  if(finished)return;
  if(!answered){if(e.key==='1')pick(0);else if(e.key==='2')pick(1);else if(e.key==='3')pick(2);else if(e.key==='4')pick(3);}
  else if((e.key==='Enter'||e.key===' ')&&document.getElementById('btn-next').style.display!=='none'){e.preventDefault();nextQ();}
});
initSession();
</script>
</body>
</html>
